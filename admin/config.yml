backend:
  name: github
  repo: bimspecialist/toolbox-suite-support
  branch: content-editor
  base_url: https://portfolio-cms-auth.workers.dev
  auth_endpoint: auth

site_url: https://bimspecialist.github.io/toolbox-suite-support/
display_url: https://bimspecialist.github.io/toolbox-suite-support/
media_folder: public/uploads
public_folder: /uploads
publish_mode: simple

collections:
  - name: site
    label: Toolbox Suite
    files:
      - name: content
        label: Site Content
        file: content/site.json
        format: json
        fields:
          - {label: Product name, name: product_name, widget: string}
          - {label: Version, name: version, widget: string}
          - {label: Headline, name: headline, widget: string}
          - {label: Arabic headline, name: headline_ar, widget: string, required: false}
          - {label: Description, name: description, widget: text}
          - {label: Arabic description, name: description_ar, widget: text, required: false}
          - label: Screenshots
            name: screenshots
            widget: list
            field: {label: Image, name: image, widget: image}
